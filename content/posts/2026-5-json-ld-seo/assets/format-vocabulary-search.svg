<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc"><title id="title">表达格式、共同词汇、搜索规则各有职责</title><desc id="desc">JSON-LD 用 Schema.org 词汇表达数据，搜索引擎读取后依据自身规则处理。</desc><defs><style>.bg{fill:#010102}.box{fill:#0f1011;stroke:#34343a}.title{fill:#f7f8f8;font:600 30px Inter,"PingFang SC",sans-serif}.h{fill:#f7f8f8;font:500 24px Inter,"PingFang SC",sans-serif}.note{fill:#8a8f98;font:400 19px Inter,"PingFang SC",sans-serif}.line{fill:none;stroke:#5e6ad2;stroke-width:2}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#5e6ad2"/></marker></defs><rect class="bg" width="1080" height="440"/><text class="title" x="48" y="65">表达格式、共同词汇、搜索规则各有职责</text>
